services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: voicenotes:latest
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      DATABASE_URL: file:/data/voicenotes.db
      AUDIO_DIR: /data/audio
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-https://notes.cugovci.uk}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-whisper-large-v3}
      NODE_ENV: production
    expose:
      - "3000"
    # When deploying behind a Coolify-managed Traefik (or any reverse proxy),
    # Traefik talks to the container over the Docker network — no host port
    # mapping needed. For raw `docker compose up` testing, add a `ports:`
    # mapping here locally.
    volumes:
      - voicenotes-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/get-session').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: voicenotes:latest
    restart: unless-stopped
    depends_on:
      - app
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      DATABASE_URL: file:/data/voicenotes.db
      AUDIO_DIR: /data/audio
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-whisper-large-v3}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-5000}
      NODE_ENV: production
    volumes:
      - voicenotes-data:/data
    # Skip the migration entrypoint — the app container already runs migrations
    # on boot and concurrent drizzle-kit migrate races on the same SQLite file.
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["node_modules/.bin/tsx", "src/worker.ts"]

volumes:
  voicenotes-data:
